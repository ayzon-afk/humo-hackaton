name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: humo
          POSTGRES_PASSWORD: humo
          POSTGRES_DB: humo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U humo" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
      - name: Install
        run: npm ci && npm ci --prefix server && npm ci --prefix client
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Test (JSON-файл)
        run: npm test
      - name: Test (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://humo:humo@localhost:5432/humo_test
      - name: Build
        run: npm run build --prefix client
